# Local development: only Evolution API and what it needs. The bot runs on the
# host with `npm run dev:server` and uses Supabase.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Evolution manager: http://localhost:8080/manager (key = EVOLUTION_API_KEY)

services:
  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Internal to the docker network, never exposed: a fixed password is fine here.
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis_dev:/data

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Chama Lia
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
    # The bot on the host is reachable from the container at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances_dev:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  evolution_postgres_dev:
  evolution_redis_dev:
  evolution_instances_dev:
