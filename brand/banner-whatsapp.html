<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner Chama Lia</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden; position: relative;
    background: #0e0f13; color: #fff;
    font-family: "Inter", "Segoe UI", sans-serif;
  }
  /*
   * WhatsApp shows only a middle band of the cover and puts the round profile
   * photo over its bottom center. So: no logo here (the photo is the logo),
   * text in the upper part of the band, bottom center left empty.
   */
  .headline {
    position: absolute; left: 0; right: 0; top: 300px;
    text-align: center; margin: 0;
    font-size: 92px; line-height: 1.08; font-weight: 700; letter-spacing: -2.5px;
  }
  .headline span { color: #3b82f6; }
  .sub {
    position: absolute; left: 0; right: 0; top: 530px;
    text-align: center; margin: 0;
    font-size: 40px; color: #a1a1aa;
  }
</style>
</head>
<body>
  <h1 class="headline">Sua atendente no WhatsApp,<br><span>sempre disponível.</span></h1>
  <p class="sub">Agenda, confirma e lembra seus clientes.</p>
</body>
</html>
